<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #09090b;
      color: #fafafa;
      margin: 0;
      padding: 16px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f1f23;
      padding-bottom: 12px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 750;
      background: linear-gradient(135deg, #c084fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .status-badge.disconnected {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .stats-card {
      background: #141417;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stats-label {
      font-size: 11px;
      color: #a1a1aa;
    }
    .stats-val {
      font-size: 18px;
      font-weight: 800;
      color: #c084fc;
    }
    .desc {
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.5;
      margin: 0;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #d4d4d8;
    }
    input {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 9px 12px;
      color: #fafafa;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #a855f7;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border: none;
      border-radius: 8px;
      color: white;
      padding: 9px 16px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.25);
    }
    button:hover {
      opacity: 0.95;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: #1f1f23;
      border: 1px solid #2e2e33;
      color: #d4d4d8;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #27272a;
      color: #fafafa;
    }
    #status-msg {
      font-size: 11px;
      text-align: center;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
    }
    .msg-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .msg-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
        <h3>HireMateX</h3>
      </div>
      <div id="connection-pill" class="status-badge disconnected">
        <span class="status-dot"></span>
        <span id="connection-text">Disconnected</span>
      </div>
    </div>

    <div class="stats-card">
      <span class="stats-label">Jobs Synced this Session</span>
      <span id="synced-count" class="stats-val">0</span>
    </div>
    
    <p class="desc">
      Browse job vacancies on <strong>LinkedIn</strong>, <strong>Indeed</strong>, or <strong>Naukri</strong>. Sourced vacancies automatically appear in your HireMateX dashboard.
    </p>

    <div class="field">
      <label for="token">Access Token</label>
      <input type="password" id="token" placeholder="Paste connection token from Settings..." />
    </div>

    <div class="field">
      <label for="api-url" style="color: #71717a; font-size: 9px;">Backend API URL</label>
      <input type="text" id="api-url" placeholder="https://hirematex-api-97nu.onrender.com" />
    </div>

    <div class="btn-group">
      <button id="save">Save & Connect</button>
      <button id="get-token-btn" class="btn-secondary">Open Settings to Copy Token</button>
    </div>

    <div id="status-msg"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
